name: Android CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Build, lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Sign debug builds with the repo owner's debug keystore (stored as a
      # base64 secret) so CI APKs carry the same certificate SHA-1 that is
      # registered for Google Drive OAuth. Without the secret, CI falls back
      # to a runner-generated keystore and the APK still builds fine — but
      # Google sign-in won't work in that artifact.
      - name: Install debug keystore from secret
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Installed debug keystore from secret."
          else
            echo "DEBUG_KEYSTORE_B64 secret not set; artifact APKs will use a runner-generated keystore (Google sign-in won't work in them)."
          fi

      - name: Build, lint and run unit tests
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: audio-journal-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          # Allow re-runs of the same workflow run to replace the artifact
          # (v4 artifacts are otherwise immutable, so a re-run after e.g. a
          # secret change would silently keep the stale APK).
          overwrite: true

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports
            app/build/test-results
